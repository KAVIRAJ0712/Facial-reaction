<!DOCTYPE html>
<html>
<head>
    <title>Facial Emotion Based Tamil Songs</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a, #000);
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 25px;
            font-size: 32px;
            text-shadow: 0 0 10px #00eaff;
        }

        .video-container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
            border: 3px solid #00eaff;
            border-radius: 10px;
            box-shadow: 0 0 20px #00eaff;
        }

        img {
            display: block;
            border-radius: 6px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 18px;
            background: #00eaff;
            border: none;
            border-radius: 8px;
            color: #000;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s ease;
        }

        button:hover {
            background: #00aabb;
            box-shadow: 0px 0px 15px #00eaff;
        }

        p {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
            color: #ffda79;
            text-shadow: 0 0 10px #ffda79;
            min-height: 25px; /* Ensures space for text even if empty */
        }
    </style>
</head>
<body>

    <h1>Live Facial Emotion Detection</h1>

    <div class="video-container">
        <img src="{{ url_for('video_feed') }}" width="640" height="480" alt="Video Feed">
    </div>

    <button onclick="analyzeEmotion()">Analyze Emotion</button>

    <p id="emotion_text">Click 'Analyze Emotion' to start.</p>

    <script>
        function analyzeEmotion() {
            document.getElementById('emotion_text').innerText = "Analyzing...";

            fetch('/analyze', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    const emotionTextElement = document.getElementById('emotion_text');
                    if (data.emotion) {
                        emotionTextElement.style.color = '#00ff00';
                        emotionTextElement.innerText = "✅ Detected Emotion: " + data.emotion.toUpperCase() + " (Playing song...)";
                    } else if (data.error) {
                        emotionTextElement.style.color = '#ff4444';
                        emotionTextElement.innerText = "❌ Error: " + data.error;
                    }
                })
                .catch(err => {
                    document.getElementById('emotion_text').innerText = "Network Error: " + err;
                });
        }
    </script>

</body>
</html>
