<!DOCTYPE html>
<html>
<head>
    <title>Facial Emotion Based Tamil Songs</title>
    <style>
        body { text-align: center; font-family: Arial; background: #222; color: #fff; }
        h1 { margin-top: 20px; }
        img { border: 2px solid #fff; margin-top: 20px; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; }
        p { font-size: 20px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Live Facial Emotion Detection</h1>
    <img src="{{ url_for('video_feed') }}" width="640" height="480">
    <br>
    <button onclick="analyzeEmotion()">Analyze Emotion</button>
    <p id="emotion_text">Detected Emotion will appear here</p>

    <script>
        function analyzeEmotion() {
            document.getElementById('emotion_text').innerText = "Analyzing...";
            fetch('/analyze', {method: 'POST'})
                .then(response => response.json())
                .then(data => {
                    if (data.emotion) {
                        document.getElementById('emotion_text').innerText = "Detected Emotion: " + data.emotion;
                    } else if (data.error) {
                        document.getElementById('emotion_text').innerText = "Error: " + data.error;
                    }
                })
                .catch(err => {
                    document.getElementById('emotion_text').innerText = "Error: " + err;
                });
        }
    </script>
</body>
</html>
